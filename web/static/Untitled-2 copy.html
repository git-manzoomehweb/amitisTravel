<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مبدل تاریخ شمسی و میلادی</title>
<script>
const monthsFa = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
const monthsEn = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function isLeap(year, type) {
  if (type === 'grg') return (year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0));
  let mod = (year + 38) % 2820 % 128;
  return mod % 4 === 0;
}

function toShamsi(gy, gm, gd) {
  let g_d_m = [0, 31, (isLeap(gy, 'grg') ? 29 : 28), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gy_day_no = (gy - 1600) * 365 + Math.floor((gy - 1600 + 3) / 4) - Math.floor((gy - 1600 + 99) / 100) + Math.floor((gy - 1600 + 399) / 400);
  for (let i = 1; i < gm; i++) gy_day_no += g_d_m[i];
  gy_day_no += gd - 1;
  let j_day_no = gy_day_no - 79;
  let j_np = Math.floor(j_day_no / 12053);
  j_day_no %= 12053;
  let jy = 979 + 33 * j_np + 4 * Math.floor(j_day_no / 1461);
  j_day_no %= 1461;
  if (j_day_no >= 366) {
    jy += Math.floor((j_day_no - 1) / 365);
    j_day_no = (j_day_no - 1) % 365;
  }
  let jm = (j_day_no < 186) ? 1 + Math.floor(j_day_no / 31) : 7 + Math.floor((j_day_no - 186) / 30);
  let jd = (j_day_no < 186) ? 1 + (j_day_no % 31) : 1 + ((j_day_no - 186) % 30);
  return [jy, jm, jd, monthsFa[jm - 1]];
}

function toGregorian(jy, jm, jd) {
  jy = jy - 979;
  let days = (jm <= 6) ? (jm - 1) * 31 + jd - 1 : 186 + (jm - 7) * 30 + jd - 1;
  let g_day_no = 365 * jy + Math.floor(jy / 33) * 8 + Math.floor((jy % 33 + 3) / 4) + days + 79;
  let gy = 1600 + 400 * Math.floor(g_day_no / 146097);
  g_day_no %= 146097;
  let leap = true;
  if (g_day_no >= 36525) {
    g_day_no--;
    gy += 100 * Math.floor(g_day_no / 36524);
    g_day_no %= 36524;
    if (g_day_no >= 365) g_day_no++;
    else leap = false;
  }
  gy += 4 * Math.floor(g_day_no / 1461);
  g_day_no %= 1461;
  if (g_day_no >= 366) {
    leap = false;
    g_day_no--;
    gy += Math.floor(g_day_no / 365);
    g_day_no %= 365;
  }
  let gm = 0, gd = g_day_no + 1;
  let g_days_in_month = [31, (leap ? 29 : 28), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  while (gm < 12 && gd > g_days_in_month[gm]) gd -= g_days_in_month[gm++];
  return [gy, gm + 1, gd, monthsEn[gm]];
}

function convert() {
  let type = document.querySelector('input[name="calendar"]:checked').value;
  let year = parseInt(document.getElementById('year').value);
  let month = parseInt(document.getElementById('month').value);
  let day = parseInt(document.getElementById('day').value);

  if (!year || !month || !day) {
    alert('لطفاً تمام فیلدها را پر کنید.');
    return;
  }

  let result = type === 'shamsi' ? toGregorian(year, month, day) : toShamsi(year, month, day);
  document.getElementById('result').innerText = `${result[0]} ${result[3]} ${result[2].toString().padStart(2, '0')}`;
}

function fillOptions(start, end, select) {
  select.innerHTML = '';
  for (let i = start; i >= end; i--) {
    select.innerHTML += `<option>${i}</option>`;
  }
}

function updateYears() {
  let type = document.querySelector('input[name="calendar"]:checked').value;
  let yearSelect = document.getElementById('year');
  let start = type === 'shamsi' ? 1500 : 2100;
  let end = type === 'shamsi' ? 1300 : 1900;
  fillOptions(start, end, yearSelect);
}

function updateDays() {
  let daySelect = document.getElementById('day');
  let month = parseInt(document.getElementById('month').value);
  let type = document.querySelector('input[name="calendar"]:checked').value;
  let year = parseInt(document.getElementById('year').value);
  let days = (month <= 6) ? 31 : (month <= 11 ? 30 : (type === 'shamsi' ? (isLeap(year, 'hsh') ? 30 : 29) : (isLeap(year, 'grg') ? 29 : 28)));
  fillOptions(days, 1, daySelect);
}

document.addEventListener('DOMContentLoaded', () => {
  monthsFa.forEach((month, index) => {
    document.getElementById('month').innerHTML += `<option value="${index + 1}">${month}</option>`;
  });
  updateYears();
  updateDays();
});
</script>
</head>
<body class="bg-gray-100 p-10">
<div class="max-w-md mx-auto bg-white shadow-md p-6 rounded-lg">
<h2 class="text-xl text-center mb-4">مبدل تاریخ</h2>
<div>
<label><input type="radio" name="calendar" value="shamsi" checked onchange="updateYears()"> شمسی به میلادی</label>
<label><input type="radio" name="calendar" value="gregorian" onchange="updateYears()"> میلادی به شمسی</label>
</div>
<select id="year" onchange="updateDays()"></select>
<select id="month" onchange="updateDays()"></select>
<select id="day"></select>
<button onclick="convert()" class="bg-blue-500 text-white p-2 mt-4 rounded">تبدیل</button>
<div id="result" class="mt-4 bg-gray-200 p-4 rounded"></div>
</div>
</body>
</html>
