<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پخش صوتی با افکت موجی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 🔹 انیمیشن لرزش (Pulse) */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        /* 🔹 افکت Glow هنگام پخش */
        .playing {
            animation: pulse 1.2s infinite ease-in-out;
            /* box-shadow: 0px 0px 15px rgba(59, 130, 246, 0.8);  */
            border-radius: 8px;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-100">

    <div id="audioBox" class="bg-white shadow-lg rounded-2xl p-6 w-96 text-center cursor-pointer transition hover:bg-gray-200">
        <!-- دکمه پخش -->
        <button id="playPauseBtn" class="w-14 h-14 bg-blue-500 text-white text-2xl rounded-full flex justify-center items-center shadow-md transition hover:bg-blue-600">
            ▶
        </button>

        <!-- موج صوتی -->
        <div id="waveform" class="mt-4"></div>
    </div>

    <!-- Wavesurfer.js -->
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const playPauseBtn = document.getElementById("playPauseBtn");
            const audioBox = document.getElementById("audioBox");
            const waveContainer = document.getElementById("waveform");
            let isManuallyPlaying = false; // کنترل پخش توسط کلیک

            // ساخت موج صوتی
            const wavesurfer = WaveSurfer.create({
                container: '#waveform',
                waveColor: '#3b82f6',
                progressColor: '#1e40af',
                cursorColor: 'transparent',
                barWidth: 3,
                height: 50,
                responsive: true
            });

            // بارگذاری فایل صوتی
            const audioUrl = "../assets/images/non-upload/Audio for Capture 03.mp3";
            wavesurfer.load(audioUrl);

            // تابع پخش و توقف
            function togglePlayPause() {
                if (wavesurfer.isPlaying()) {
                    wavesurfer.pause();
                    playPauseBtn.textContent = '▶';
                    isManuallyPlaying = false;
                    waveContainer.classList.remove("playing"); // حذف انیمیشن
                } else {
                    wavesurfer.play();
                    playPauseBtn.textContent = '⏸';
                    isManuallyPlaying = true;
                    waveContainer.classList.add("playing"); // افزودن انیمیشن
                }
            }

            // کلیک برای کنترل پخش و توقف
            playPauseBtn.addEventListener('click', function () {
                togglePlayPause();
            });

            // هاور برای پخش صدا (فقط اگر دستی متوقف نشده باشد)
            audioBox.addEventListener('mouseenter', function () {
                if (!wavesurfer.isPlaying() && !isManuallyPlaying) {
                    wavesurfer.play();
                    playPauseBtn.textContent = '⏸';
                    waveContainer.classList.add("playing"); // افزودن انیمیشن
                }
            });

            // وقتی موس خارج شد، اگر کلیک نشده بود متوقف شود
            audioBox.addEventListener('mouseleave', function () {
                if (!isManuallyPlaying) {
                    wavesurfer.pause();
                    playPauseBtn.textContent = '▶';
                    waveContainer.classList.remove("playing"); // حذف انیمیشن
                }
            });
        });
    </script>

</body>
</html>
