<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

        <meta name="description" content="تور لحظه آخری | فروش تور داخلی | تور خارجی | تور لاکچری" />

        <meta property="og:title" content="آمیتیس | تور لحظه آخری | فروش تور داخلی | تور خارجی | تور لاکچری" />
        <meta property="og:url" content="https://www.amitistravel.com" />

        <meta property="og:description" content="آمیتیس | تور لحظه آخری | فروش تور داخلی | تور خارجی | تور لاکچری" />

        <meta property="og:image:height" content="59" />

        <link rel="stylesheet" type="text/css" href="[##cms.cms.cdn##]/css/amitis-master-new.css">
        <script type="text/javascript" lang="javascript" src="[##cms.cms.cdn##]/js/jquery-2.1.1.min.js"></script>
        <script type='text/javascript' src="[##cms.cms.cdn##]/js/jquery.navgoco.js"></script> <!--js menu--> 
        <script type='text/javascript' src="[##cms.cms.cdn##]/js/off-canvas.js" ></script><!--js menu-->
    </head>
    <body>
        <div id="container">
            <div class="loginRegister"></div>
            <basis core="call" file="header-new.inc"/>
            <main>
                <div id="about-resize">
                    <div class="inner-resize">
                        <div class="title-box">
                            <div class="title-spt">
                            <h2>فرم پیکاپ ویزا</h2>
                            </div>
                            <span>Visa Pickup Form</span>
                        </div>

                        <div id="contact-form-resize">
                            <div class="tours-inner">
                                <div class="tour-wrapper-box">
                                <div class="contact-form">
                                    <div class="title-box">
                                        <div class="title-spt">
                                        <h4>فرم سفارش</h4>
                                        </div>
                                        <span>Order Form</span>
                                    </div>
                                    <div class="contact-form-inner">
                                        <div id="OpinioUser-box">
                                            <form  method="post" action="/get-mail.bc">
                                                <div class="input-form"><input type="text" name="firstname" placeholder="نام" required></div>
                                                <div class="input-form"><input type="text" name="lastname" placeholder="نام خانوادگی" required></div>
                                                <div class="input-form"><input type="tel" name="tel" placeholder="شماره تماس" required></div>
                                                <div class="input-form"><input type="email" name="email" placeholder="ایمیل" required></div>
                                                <div class="input-form">
                                                    <select name="visa" required>
                                                        <option value="">نوع ویزای پیکاپ درخواستی(لطفا انتخاب کنید)</option>
                                                        <option value="آمریکا">آمریکا</option>
                                                        <option value="امارات">امارات</option>
                                                        <option value="ترکیه">ترکیه</option>
                                                        <option value="ارمنستان">ارمنستان</option>
                                                        <option value="کانادا">کانادا</option>
                                                        <option value="انگلیس">انگلیس</option>
                                                    </select>
                                                </div>
                                                <div class="input-form">
                                                    <select name="familiarity" required>
                                                        <option value="">نحوه آشنایی با ما(لطفا انتخاب کنید)</option>
                                                        <option value="جستجوی گوگل">جستجوی گوگل</option>
                                                        <option value="ایستاگرام">ایستاگرام</option>
                                                        <option value="تلگرام">تلگرام</option>
                                                        <option value="آشنایان">آشنایان</option>
                                                        <option value="سایر">سایر</option>
                                                    </select>
                                                </div>
                                                <div class="input-form submit"><input type="submit" id="OpinionSubmit" value="ارسال"></div>
                                            </form>
                                          </div>
                                    </div>
                                </div>
                                <div class="clr"></div>
                               </div>
                                <div class="clr"></div>
                            </div>
                            <div class="clr"></div>
                        </div>
                        <div class="clr"></div>
                    </div>
                    <div class="clr"></div>
                </div>
                <div class="clr"></div>
                </main>
                <basis core="call" file="footer-new.inc"/>
                </div>
                <div class="clr"></div>
           
  
            <div class="clr"></div>
        </div>

        <script>

        </script>

    </body>
</html>
